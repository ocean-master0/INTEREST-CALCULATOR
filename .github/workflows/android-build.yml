name: Build Android APK

on:
  push:
    branches: [ apk ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so the built-in GITHUB_TOKEN can create/update Releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install JS deps
        run: npm install

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Capacitor 7 Android toolchain (Gradle 8.11 / AGP 8.7) requires JDK 21
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.sha }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk interest-calculator.apk
          # Rolling release: replace the previous build under the same tag
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest interest-calculator.apk \
            --title "Interest Calculator APK ($VERSION)" \
            --notes "Debug APK - auto-built from the apk branch.

Install: download interest-calculator.apk and open it on your Android phone (allow 'Install unknown apps' if asked).

Fully offline - no internet permission needed at runtime."
